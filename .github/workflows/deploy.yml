# Deploy MT5 Free Tools to GitHub Pages.
#
# On every push to main this workflow
#   1. validates every products/**/product.json (a broken manifest fails the run),
#   2. rebuilds assets/data/catalog.json and sitemap.xml from the product folders,
#   3. publishes the whole repository as the site.
#
# It needs Settings > Pages > Build and deployment > Source = "GitHub Actions".
# No secrets are required beyond the automatic Pages token.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate product metadata
        run: python3 scripts/build_catalog.py --check --strict

      - name: Build product catalogue and sitemap
        run: python3 scripts/build_catalog.py --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
